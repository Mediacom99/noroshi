# Demo stack: noroshi monitor + web dashboard (nginx serves the SPA and
# proxies /api to the monitor, so no CORS setup is needed).
#
# Uses the seeded dev database (./data/dev.db) and a bogus Telegram chat ID
# so demo "down" endpoints never deliver alerts to the real chat.
#
#   docker compose -f docker-compose.dashboard.yml up -d --build
#   → dashboard on http://localhost:5173 (login token: dev-token)
services:
  monitor:
    build: .
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=-1 # demo: alerts go nowhere
      - DATABASE_PATH=/app/data/dev.db
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-dev-token}
      - LOG_LEVEL=warn
    volumes:
      - ./data:/app/data

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - monitor
